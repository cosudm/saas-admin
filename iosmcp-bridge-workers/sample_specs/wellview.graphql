# WellView GraphQL API (sample)
type Query {
  well(api14: ID!): Well
  wells(state: String, first: Int = 10): [Well]
  filings(agency: String): [Filing]
}
type Mutation {
  draftFiling(api14: ID!, form: String!, agency: String!, period: String!): Filing
}
type Well { api14: ID name: String state: String operator: String }
type Filing { id: ID form: String agency: String status: String }