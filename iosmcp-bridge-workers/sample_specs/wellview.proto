syntax = "proto3";
package wellview.v1;

message GetWellRequest { string api14 = 1; }
message Well { string api14 = 1; string name = 2; string state = 3; repeated string tags = 4; }
message ListWellsRequest { string state = 1; int32 page_size = 2; }
message ListWellsResponse { repeated Well wells = 1; }
message DraftFilingRequest { string api14 = 1; string form = 2; string agency = 3; string period = 4; }
message Filing { string id = 1; string status = 2; }

service WellService {
  rpc GetWell(GetWellRequest) returns (Well);
  rpc ListWells(ListWellsRequest) returns (ListWellsResponse);
  rpc DraftFiling(DraftFilingRequest) returns (Filing);
}